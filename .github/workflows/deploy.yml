name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的 push 會取消尚未完成的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # tracer 測試直接在 Python 執行；版本對齊 Pyodide 0.26 內的 Python 3.12
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - run: npm run build

      # 測試沒過就停在這裡，不會上傳與部署
      # e2e 會以 vite preview 啟動 dist/，並用 runner 內建的 Google Chrome 操作網站
      - name: Test
        run: npm test

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
